name: Recomvia quality gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recomvia-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: "true"
      AUTH_PROVIDER: google
      PAYPAL_ENABLED: "false"
      NEXT_PUBLIC_SITE_URL: https://recomvia-ai-visibility.omarghazi85.chatgpt.site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Static checks
        run: |
          pnpm lint
          pnpm typecheck
      - name: Functional and regression tests
        run: |
          pnpm test:public
          pnpm test:entitlements
          pnpm test:targets
          pnpm test:plans
          pnpm test:visibility
          pnpm test:paypal
      - name: Cloudflare-compatible build
        run: pnpm build
